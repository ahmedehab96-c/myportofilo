# Manual deploy only — build locally with ./scripts/deploy_netlify.sh
# Git push does NOT trigger a Netlify build (ignore always skips CI).
[build]
  publish = "build/web"
  command = "echo 'Skipped — use ./scripts/deploy_netlify.sh for manual deploy'"
  ignore = "true"

[build.environment]
  NETLIFY_DEPLOY = "1"

# Nested Flutter admin SPA (before portfolio catch-all).
[[redirects]]
  from = "/demos/mezo-admin/*"
  to = "/demos/mezo-admin/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/demos/stepzone/*"
  to = "/demos/stepzone/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/demos/mezo/*"
  to = "/demos/mezo/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/demos/itassist/*"
  to = "/demos/itassist/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/flutter.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/main.dart.mjs"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/main.dart.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/docs/*"
  [headers.values]
    Content-Type = "application/pdf"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/apks/*"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/demos/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
