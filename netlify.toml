# Remote build on Netlify CI: builds automatically on every push to main.
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Nested built SPAs (before the portfolio catch-all).
[[redirects]]
  from = "/demos/mezo-admin/*"
  to = "/demos/mezo-admin/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/demos/stepzone/*"
  to = "/demos/stepzone/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/demos/mezo/*"
  to = "/demos/mezo/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/demos/itassist/*"
  to = "/demos/itassist/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/docs/*"
  [headers.values]
    Content-Type = "application/pdf"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/apks/*"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/demos/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
